<!doctype html>
<html lang="en" data-beasties-container>
<head>
  <meta charset="utf-8">
  <title>Mercator — Course Operations</title>
  <base href="/Mercator/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <style>
    #auth-gate{position:fixed;inset:0;background:#1B1E21;display:flex;align-items:center;justify-content:center;z-index:9999;font-family:Inter,system-ui,-apple-system,sans-serif}
    #auth-gate .gate-box{text-align:center;padding:48px 48px 40px;border-radius:16px;background:#242830;box-shadow:0 8px 32px rgba(0,0,0,.4);max-width:400px;width:90%;border-top:3px solid #C8102E}
    #auth-gate .logo-wrap{margin-bottom:28px}
    #auth-gate .logo-wrap img{height:52px;opacity:1}
    #auth-gate .brand-sub{color:#9ca3af;font-size:11px;text-transform:uppercase;letter-spacing:2px;margin-top:10px}
    #auth-gate h2{color:#fff;font-size:20px;font-weight:600;margin-bottom:6px}
    #auth-gate p{color:#9ca3af;font-size:13px;margin-bottom:22px}
    #auth-gate input{width:100%;padding:12px 16px;border-radius:8px;border:1px solid #3f4451;background:#1B1E21;color:#fff;font-size:14px;outline:none;transition:border-color .2s}
    #auth-gate input:focus{border-color:#C8102E}
    #auth-gate button{margin-top:14px;width:100%;padding:12px;border-radius:8px;border:none;background:#C8102E;color:#fff;font-size:14px;font-weight:600;cursor:pointer;transition:background .2s}
    #auth-gate button:hover{background:#a00d24}
    #auth-gate .error{color:#ef4444;font-size:12px;margin-top:10px;display:none}
    #auth-gate .footer-text{color:#4b5563;font-size:11px;margin-top:24px}
  </style>
<link rel="stylesheet" href="styles-DQDEQYRS.css" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="styles-DQDEQYRS.css"></noscript></head>
<body class="bg-app min-h-dvh overflow-x-hidden">

  <!-- Password Gate -->
  <div id="auth-gate">
    <div class="gate-box">
      <div class="logo-wrap">
        <img src="assets/toro-logo.svg" alt="Toro">
        <div class="brand-sub">Course Operations Platform</div>
      </div>
      <h2>Mercator</h2>
      <p>Enter your access code to continue</p>
      <input type="password" id="gate-pw" placeholder="Access code" autocomplete="off">
      <button onclick="checkGate()">Sign In</button>
      <div class="error" id="gate-err">Incorrect access code</div>
      <div class="footer-text">© 2026 The Toro Company</div>
    </div>
  </div>

  <script>
    // Simple hash check — not crypto-grade but sufficient for demo gating
    function simpleHash(s){var h=0;for(var i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0;}return h}
    var EXPECTED=-2861026; // hash of the password
    function checkGate(){
      var v=document.getElementById('gate-pw').value;
      if(simpleHash(v)===EXPECTED){
        sessionStorage.setItem('mercator_auth','1');
        document.getElementById('auth-gate').remove();
        loadApp();
      } else {
        document.getElementById('gate-err').style.display='block';
        document.getElementById('gate-pw').value='';
      }
    }
    document.addEventListener('keydown',function(e){if(e.key==='Enter'&&document.getElementById('auth-gate'))checkGate()});
    if(sessionStorage.getItem('mercator_auth')==='1'){
      document.getElementById('auth-gate').remove();
      document.addEventListener('DOMContentLoaded',loadApp);
    }
    function loadApp(){
      // Inject the app scripts dynamically after auth
      var s1=document.createElement('script');s1.src='polyfills-B6TNHZQ6.js';s1.type='module';document.body.appendChild(s1);
      var s2=document.createElement('script');s2.src='main-62JEMVAG.js';s2.type='module';document.body.appendChild(s2);
    }
  </script>

  <!-- Pre-splash (shows after auth, before Angular boots) -->
  <style>
    #gol270-pre-splash {
      position: fixed; inset: 0; background: #1B1E21;
      display: flex; align-items: center; justify-content: center;
      z-index: 1200;
    }
    #gol270-pre-splash img { height: 48px; opacity: 0.95; }
  </style>
  <div id="gol270-pre-splash"><img src="assets/toro-logo.svg" alt></div>
  <script>
    var gol270_remove = function () {
      var el = document.getElementById('gol270-pre-splash');
      if (el) el.parentNode.removeChild(el);
    };
    var gol270_obs = new MutationObserver(function () {
      var root = document.querySelector('app-root > app-shell');
      if (root) { gol270_remove(); gol270_obs.disconnect(); }
    });
    gol270_obs.observe(document.body, { childList: true, subtree: true });
    setTimeout(gol270_remove, 4000);
  </script>

  <app-root></app-root>
</body>
</html>
