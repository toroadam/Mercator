<body class="bg-app min-h-dvh overflow-x-hidden">
  <!-- GOL-270 cold-start: paint a brand splash before Angular boots so
       there is no FOUC/whitescreen. App-shell removes its own splash after
       the skeleton/fade-in handshake. -->
  <style>
    #gol270-pre-splash {
      position: fixed; inset: 0; background: #1B1E21;
      display: flex; align-items: center; justify-content: center;
      z-index: 1200;
    }
    #gol270-pre-splash img { height: 48px; opacity: 0.95; }
  </style>
  <div id="gol270-pre-splash"><img src="assets/toro-logo.svg" alt></div>
  <script>
    // Remove pre-splash once Angular root has rendered something (or after 1s).
    var gol270_remove = function () {
      var el = document.getElementById('gol270-pre-splash');
      if (el) el.parentNode.removeChild(el);
    };
    var gol270_obs = new MutationObserver(function () {
      var root = document.querySelector('app-root > app-shell');
      if (root) { gol270_remove(); gol270_obs.disconnect(); }
    });
    gol270_obs.observe(document.body, { childList: true, subtree: true });
    setTimeout(gol270_remove, 1000);
  </script>
